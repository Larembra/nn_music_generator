[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-generator"
version = "0.1.0"
description = "Character-level recurrent neural network for ABC music generation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tensorflow>=2.15",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
music-generator = "music_generator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
